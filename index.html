<style>
:root{--bg:#F4F5F8;--card:#fff;--ink:#14171F;--ink2:#5B6170;--line:#D9DCE3;--accent:#2B54D4;--err:#B53A28}
@media (prefers-color-scheme:dark){:root{--bg:#0E1119;--card:#171B26;--ink:#ECEEF3;--ink2:#9AA1B2;--line:#2A3040;--accent:#7E9BFF;--err:#F08A73}}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom))}
.box{box-sizing:border-box;width:100%;max-width:360px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px 22px;text-align:center}
.logo{width:56px;height:56px;margin:0 auto 10px}
h1{font-size:22px;margin:0 0 4px}
p{margin:0 0 18px;color:var(--ink2);font-size:14px}
input{box-sizing:border-box;width:100%;font:600 20px/1.2 ui-monospace,Menlo,monospace;letter-spacing:.08em;text-align:center;text-transform:uppercase;padding:12px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
input:focus{outline:none;border-color:var(--accent)}
button{margin-top:12px;width:100%;font-family:inherit;font-weight:600;font-size:16px;line-height:1;padding:14px;border:0;border-radius:10px;background:var(--accent);color:#fff;cursor:pointer}
button:disabled{opacity:.6}
.msg{min-height:1.4em;margin:12px 0 0;font-size:14px;color:var(--err)}
.wait{color:var(--ink2)}
</style>
</head>

<script>
(function(){

  var T=es?{lead:'Escribí tu código de acceso.',go:'Entrar',bad:'Ese código no es válido.',wait:'Abriendo…',old:'Este navegador es muy viejo para Grilla. Actualizá el iPhone e intentá de nuevo.'}
          :{lead:'Enter your access code.',go:'Open',bad:'That code is not valid.',wait:'Opening…',old:'This browser is too old for Grilla. Update your device and try again.'};
  document.getElementById('lead').textContent=T.lead;document.getElementById('b').textContent=T.go;

  var L=JSON.parse(document.getElementById('lock').textContent);
  var f=document.getElementById('f'),inp=document.getElementById('c'),msg=document.getElementById('m'),btn=document.getElementById('b');
  var b64=function(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u};
  var norm=function(s){return String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'')};
  var KEY='grilla.acceso';
  var get=function(){try{return localStorage.getItem(KEY)}catch(e){return null}},put=function(v){try{v?localStorage.setItem(KEY,v):localStorage.removeItem(KEY)}catch(e){}};
  async function tag(code){var h=new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode('grilla|'+code)));return Array.from(h.slice(0,3)).map(function(x){return x.toString(16).padStart(2,'0')}).join('')}
  async function open(code){
    var S=crypto.subtle,t=await tag(code);
    var slot=L.slots.filter(function(s){return s.t===t})[0];if(!slot)return false;
    try{
      var base=await S.importKey('raw',new TextEncoder().encode(code),'PBKDF2',false,['deriveKey']);
      var kek=await S.deriveKey({name:'PBKDF2',salt:b64(slot.s),iterations:L.n,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
      var raw=await S.decrypt({name:'AES-GCM',iv:b64(slot.i)},kek,b64(slot.w));
      var key=await S.importKey('raw',raw,'AES-GCM',false,['decrypt']);
      var html=new TextDecoder().decode(await S.decrypt({name:'AES-GCM',iv:b64(L.iv)},key,b64(L.ct)));
    }catch(e){return false}
    put(code);
    document.open();document.write(html);document.close();
    return true;
  }
  f.addEventListener('submit',async function(ev){
    ev.preventDefault();var c=norm(inp.value);if(!c)return;
    btn.disabled=true;msg.className='msg wait';msg.textContent=T.wait;
    var ok=false;try{ok=await open(c)}catch(e){}
    if(!ok){btn.disabled=false;msg.className='msg';msg.textContent=T.bad;inp.select()}
  });
  (async function(){
    if(!(window.crypto&&crypto.subtle&&window.TextDecoder)){f.hidden=false;msg.textContent=T.old;btn.disabled=true;return}
    var saved=get();
    if(saved){var ok=false;try{ok=await open(saved)}catch(e){}if(ok)return;put(null)}

  })();
